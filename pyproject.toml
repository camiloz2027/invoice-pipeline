[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-pipeline"
version = "0.1.0"
description = "Extracts data from PDF invoices with AI, validates it and analyzes it in SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["python-dotenv>=1.0", "pypdfium2>=5.14", "pillow>=10.1"]

[project.urls]
Repository = "https://github.com/camiloz2027/invoice-pipeline"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
